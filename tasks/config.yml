---

- name: FLUENTD | Create server conf path
  file:
    path: "{{ fluentd_conf_path }}"
    state: directory
    owner: "{{ fluentd_user }}"
    group: "{{ fluentd_group }}"
    mode: '0755'

- name: FLUENTD | Create log path
  file:
    path: "{{ fluentd_log_path }}"
    state: directory
    owner: "{{ fluentd_user }}"
    group: "{{ fluentd_group }}"
    mode: '0755'

- name: FLUENTD | Copy server config
  template:
    src: "{{ fluentd_playbook_templates_path }}/fluent.conf.j2"
    dest: "{{ fluentd_conf_path }}/fluentd.conf"
    owner: "{{ fluentd_user }}"
    group: "{{ fluentd_group }}"
    mode: '0644'
  notify: restart fluentd

- name: FLUENTD | Write fluentd environment defaults
  ansible.builtin.lineinfile:
    path: /etc/default/fluentd
    line: "{{ item.key }}={{ item.value }}"
    regexp: "^{{ item.key }}=.*"
    state: present
  with_dict: "{{ fluentd_service_environment }}"
  notify: restart fluentd
