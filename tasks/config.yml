---

- name: FLUENTD | Create server conf path
  file:
    path: "{{ fluentd_conf_path }}"
    state: directory
    owner: "{{ fluentd_user }}"
    group: "{{ fluentd_group }}"
    mode: '0755'

- name: FLUENTD | Create log path
  file:
    path: "{{ fluentd_log_path }}"
    state: directory
    owner: "{{ fluentd_user }}"
    group: "{{ fluentd_group }}"
    mode: '0755'

- name: FLUENTD | Copy server config
  template:
    src: "{{ fluentd_playbook_templates_path }}/fluent.conf.j2"
    dest: "{{ fluentd_conf_path }}/fluentd.conf"
    owner: "{{ fluentd_user }}"
    group: "{{ fluentd_group }}"
    mode: '0644'
  notify: restart fluentd

- name: FLUENTD | Write fluentd environment defaults
  # fluent-package's shipped systemd unit already reads this file via
  # `EnvironmentFile=-/etc/default/fluentd`, so environment variables
  # (LOGZ_TOKEN, proxy settings, etc.) must be delivered here instead of
  # via a custom fluentd.service unit, which would otherwise get replaced
  # by the fluent-package apt package on install/upgrade.
  template:
    src: "{{ fluentd_default_template_path }}"
    dest: /etc/default/fluentd
    owner: root
    group: root
    mode: '0600'
  notify: restart fluentd
